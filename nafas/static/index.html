<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نَفَس — Nafas</title>
<meta name="description" content="Match commentary that spends each viewer's attention like a budget, plus an investor ledger that separates skill from luck. Synthetic data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230B3A2B'/%3E%3Cpath d='M3 16h6l2-8 3 16 3-11 2 3h10' fill='none' stroke='%23EAF2EC' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* stage: a pitch seen at night */
  --turf:#0A3326; --turf-deep:#06241B; --stripe:rgba(255,255,255,.028); --chalk:#EAF2EC; --chalk-2:#9FBBAA; --chalk-line:rgba(234,242,236,.2);
  --flare:#FF6B4A; --mint:#4FD6A0; --gold:#F5B63A;
  /* paper: the scouting sheet */
  --sheet:#EEF3EF; --card:#FFFFFF; --ink:#0B2A20; --ink-2:#506B5E; --rule:#C9D8CF;
  --skill:#0F7A57; --luck:#CF8300; --alert:#C8391B;
  --display:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --gutter:clamp(16px,4vw,32px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sheet:#07180F; --card:#0C2318; --ink:#E6F0E9; --ink-2:#8FB09C; --rule:#1E3D2E; --skill:#4FD6A0; --luck:#F5B63A; --alert:#FF6B4A; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sheet);color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.7;font-feature-settings:"tnum" 1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;color:var(--chalk);
  background:
    repeating-linear-gradient(90deg,var(--stripe) 0 72px,transparent 72px 144px),
    radial-gradient(120% 90% at 50% 0%,#0F4533 0%,var(--turf) 45%,var(--turf-deep) 100%);
  padding-bottom:6px}
.stage::before{content:"";position:absolute;left:50%;top:55%;width:min(78vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid var(--chalk-line);border-radius:50%;pointer-events:none;opacity:.55}
.stage::after{content:"";position:absolute;left:0;right:0;top:55%;height:2px;background:var(--chalk-line);opacity:.55;pointer-events:none}
.stage .wrap{position:relative;z-index:1}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:18px 0 4px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:0}
.brand svg{width:44px;height:26px;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:rgba(0,0,0,.28);border:1px solid var(--chalk-line);border-radius:6px;padding:3px}
.tabs button{background:none;border:0;padding:7px 16px;cursor:pointer;color:var(--chalk-2);border-radius:4px;font-weight:500;font-size:.95rem}
.tabs button:hover{color:var(--chalk)}
.tabs button[aria-selected="true"]{background:var(--chalk);color:var(--turf-deep)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.88rem;color:var(--chalk-2)}
.tools label{display:flex;align-items:center;gap:6px}
.tools select,.tools input[type=number],.tools .btn,.seg button{background:rgba(0,0,0,.28);border:1px solid var(--chalk-line);color:var(--chalk);padding:4px 10px;border-radius:5px;cursor:pointer}
.tools input[type=number]{width:5em;cursor:text}
.tools .btn:hover,.seg button:hover,.tools select:hover{border-color:var(--chalk-2)}
.seg{display:flex;gap:0}
.seg button{border-radius:0}
.seg button:first-child{border-start-start-radius:5px;border-end-start-radius:5px}
.seg button:last-child{border-start-end-radius:5px;border-end-end-radius:5px}
.tools .btn[aria-pressed="true"]{background:var(--gold);color:var(--turf-deep);border-color:var(--gold)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--turf-deep);border-color:var(--chalk)}
.tagline{margin:8px 0 0;color:var(--chalk-2);font-size:.9rem;max-width:62ch}

.board{direction:ltr;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 22px;padding:18px 0 0}
.board .team{font-family:var(--display);font-weight:500;font-size:clamp(1rem,2.6vw,1.5rem);color:var(--chalk-2)}
.board .team.a{text-align:right}.board .team.b{text-align:left}
.board .mid{display:flex;align-items:center;gap:clamp(12px,3vw,34px)}
.board .score{font-family:var(--display);font-weight:600;font-size:clamp(3.6rem,11vw,7.2rem);line-height:.95;min-width:.7em;text-align:center}
.board .clock{font-family:var(--display);font-size:1.05rem;color:var(--turf-deep);background:var(--gold);border-radius:999px;padding:2px 14px;font-weight:600;min-width:3.4rem;text-align:center}

.caption{direction:inherit;min-height:6.2rem;padding:8px 0 0;text-align:center}
.caption p{margin:0 auto;max-width:30ch;font-size:clamp(1.45rem,3.8vw,2.5rem);font-weight:500;line-height:1.5;animation:cap .28s ease-out}
.caption p.silent{color:var(--chalk-2);font-weight:300;font-size:clamp(1.05rem,2.4vw,1.4rem)}
.caption p.goal{color:var(--gold)}
.caption small{display:block;margin-top:6px;color:var(--chalk-2);font-size:.9rem}
@keyframes cap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.breath{padding:10px 0 0}
.breath svg{display:block;width:100%;height:auto;overflow:visible}
.breath-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 30px;color:var(--chalk-2);font-size:.88rem;padding:2px 0 16px}
.breath-meta b{color:var(--chalk);font-family:var(--display);font-size:1.15rem;font-weight:500;margin-inline-start:.3em}

/* ---------- sheet ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px clamp(28px,5vw,72px);padding:34px 0 28px}
@media (max-width:900px){ main{grid-template-columns:1fr} }
h2{font-family:var(--display);font-size:1.5rem;font-weight:600;margin:0 0 4px;line-height:1.3}
.sub{color:var(--ink-2);font-size:.92rem;margin:0 0 16px;max-width:52ch}
ol.feed{list-style:none;margin:0;padding:0;position:relative}
ol.feed::before{content:"";position:absolute;inset-block:6px;inset-inline-start:2.35rem;width:2px;background:var(--rule)}
ol.feed li{display:grid;grid-template-columns:2.7rem 1fr;gap:2px 22px;padding:10px 0;position:relative}
ol.feed .t{font-family:var(--display);color:var(--ink-2);font-size:.95rem;text-align:start;padding-top:1px}
ol.feed li::after{content:"";position:absolute;inset-inline-start:calc(2.35rem - 3px);top:18px;width:8px;height:8px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-2)}
ol.feed .txt{font-size:1.04rem}
ol.feed .note{grid-column:2;color:var(--ink-2);font-size:.86rem}
ol.feed li.goal .txt{font-weight:600;font-size:1.12rem}
ol.feed li.goal .t{color:var(--alert)}
ol.feed li.goal::after{background:var(--alert);border-color:var(--alert);width:10px;height:10px;inset-inline-start:calc(2.35rem - 4px);top:17px}
ol.feed li.new{animation:rise .5s ease-out}
@keyframes rise{from{background:color-mix(in srgb,var(--gold) 26%,transparent)}to{background:transparent}}
.mini{background:none;border:1px solid var(--skill);border-radius:999px;padding:1px 12px;color:var(--skill);cursor:pointer;font-size:.84rem}
.mini:hover{background:var(--skill);color:var(--sheet)}
.mini:disabled{opacity:.5;cursor:default}
.whatif{margin-top:6px;padding:8px 12px;border-inline-start:3px solid var(--luck);background:color-mix(in srgb,var(--luck) 10%,transparent);font-size:.9rem;grid-column:2}

.axis{direction:ltr;position:relative;height:1.5rem;font-size:.76rem;color:var(--ink-2);margin:0}
html[dir=rtl] .axis{margin:0 calc(10.5rem + 16px) 0 0}
html[dir=ltr] .axis{margin:0 0 0 calc(10.5rem + 16px)}
.axis span{position:absolute;top:0;white-space:nowrap}
@media (max-width:560px){ html[dir=rtl] .axis,html[dir=ltr] .axis{margin:0} }
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.85rem;color:var(--ink-2);margin:0 0 6px}
.sw{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em;margin-inline-end:.4em}
.ledger{list-style:none;margin:0;padding:0}
.ledger li.group{padding:18px 0 6px;font-family:var(--display);font-size:1rem;color:var(--ink-2);border-bottom:2px solid var(--ink)}
.ledger li.row{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr);gap:2px 16px;padding:12px 0 12px;border-bottom:1px solid var(--rule);align-items:center}
.ledger .who{font-weight:600;font-size:1.02rem;line-height:1.35}
.ledger .who small{display:block;color:var(--ink-2);font-weight:400;font-size:.8rem}
.ledger .gauge{direction:ltr}
.ledger .gauge svg{display:block;width:100%;height:auto;overflow:visible}
.ledger .read{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.84rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:4px;padding:0 8px;font-weight:500;font-size:.8rem;line-height:1.6}
.chip.up{color:var(--skill)}.chip.down{color:var(--alert)}.chip.mid{color:var(--ink-2)}.chip.none{color:var(--ink-2);border-style:dashed}
.luckbar{display:inline-flex;align-items:center;gap:8px}
.luckbar svg{width:90px;height:10px;display:block}
.ledger li.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 30%,transparent)}to{background:transparent}}
details.trace{border-top:1px solid var(--rule);padding:14px 0 26px}
details.trace summary{cursor:pointer;color:var(--ink-2)}
details.trace ol{margin:10px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--ink-2);max-height:16rem;overflow:auto}
details.trace li{padding:2px 0}
details.trace b{color:var(--ink);font-weight:600}
.foot{color:var(--ink-2);font-size:.82rem;padding:0 0 36px;max-width:84ch}
@media (max-width:560px){ .ledger li.row{grid-template-columns:1fr} .board{gap:6px 10px} }
@media (prefers-reduced-motion:reduce){ .caption p,ol.feed li.new,.ledger li.row.flash{animation:none} }
</style>
</head>
<body>
<div class="stage">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 44 26" aria-hidden="true"><path d="M1 13h9l3-11 5 22 5-16 3 5h18" fill="none" stroke="#4FD6A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>نَفَس</h1>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools">
      <div class="seg" id="langSeg"><button data-l="ar" aria-pressed="true">عربي</button><button data-l="en" aria-pressed="false">English</button></div>
      <label><span id="lblSpeed"></span> <select id="speed"><option value="1">1×</option><option value="6">6×</option><option value="30">30×</option><option value="60" selected>60×</option><option value="150">150×</option><option value="600">600×</option></select></label>
      <label><span id="lblSeed"></span> <input id="seed" type="number" min="0" max="10000" value="35"></label>
      <button class="btn" id="voiceBtn" aria-pressed="false"></button><span id="voiceMsg" style="max-width:26ch;font-size:.8rem;color:var(--gold)" role="status"></span>
      <button class="btn" id="restart"></button>
      <button class="btn" id="newMatch"></button>
    </div>
  </header>
  <p class="tagline" id="tagline"></p>
  <div class="board" aria-live="off">
    <div class="team a" id="tA"></div>
    <div class="mid"><span class="score" id="sA">0</span><span class="clock" id="clock">0'</span><span class="score" id="sB">0</span></div>
    <div class="team b" id="tB"></div>
  </div>
  <div class="caption" id="now" aria-live="polite"></div>
  <section class="breath" aria-label="breath">
    <svg id="breath" viewBox="0 0 1000 130" role="img" aria-labelledby="breathTitle"><title id="breathTitle"></title></svg>
    <div class="breath-meta">
      <span><span id="lSpeech"></span><b id="mSpeech">0</b></span>
      <span><span id="lSilence"></span><b id="mSilence">100%</b></span>
      <span><span id="lCut"></span><b id="mCut">0</b></span>
      <span><span id="lCatch"></span><b id="mCatch">0</b></span>
      <span><span id="lDrop"></span><b id="mDrop">0</b></span>
    </div>
  </section>
</div>
</div>

<div class="wrap">
<main>
  <section aria-label="commentary">
    <h2 id="hFeed"></h2>
    <p class="sub" id="sFeed"></p>
    <ol class="feed" id="feed"></ol>
  </section>
  <section aria-label="ledger">
    <h2 id="hLedger"></h2>
    <p class="sub" id="sLedger"></p>
    <div class="legend" id="legend"></div>
    <div class="axis" id="axis"></div>
    <ul class="ledger" id="ledger"></ul>
  </section>
</main>
<details class="trace"><summary id="traceSum"></summary><ol id="trace"></ol></details>
<p class="foot" id="foot"></p>
</div>

<script>
const T = {
  ar: {
    tagline:"تعليق يصرف انتباه المشاهد كأنه ميزانية، ودفتر مستثمر يفصل المهارة عن الحظ. بيانات تجريبية بالكامل.",
    tabs:{casual:"مشجع عادي",analyst:"محلل",blind:"وصف صوتي",investor:"مستثمر"},
    voiceOn:"🔊 الصوت شغّال", voiceOff:"🔈 شغّل الصوت", voiceHint:"الصوت يشتغل زين على 6× أو 1×.", noVoice:"جهازك ما فيه صوت عربي. الأنغام شغّالة، ثبّت صوت عربي من إعدادات النظام.", voiceTest:"الصوت شغّال", clipVoice:"صوت مسجّل (آلي)", speed:"السرعة", seed:"المباراة", restart:"إعادة", newMatch:"مباراة جديدة",
    speech:"كلام", silence:"صمت", cut:"جمل قُطعت", catch:"اختصارات", drop:"لحظات أُسقطت",
    silentNow:"صمت. ما فيه شي يستاهل الكلام الحين.", cutNote:"قُطعت لأن لحظة أهم وصلت.", catchNote:"قيلت متأخرة فاختُصرت.",
    ledgerH:"دفتر القيمة", ledgerSub:"كل لاعب وعقده (وهمي). الدائرة هي الرقم الظاهر، والشريط هو التقدير المبني على الأدلة. خط التعادل عند 1.",
    obs:"الرقم الظاهر", ev:"تقدير الأدلة", luck:"نصيب الحظ", noev:"الأدلة غير كافية", inconc:"لا حكم، النطاق يشمل التعادل",
    above:"فوق التعادل (اتجاه فقط)", below:"تحت التعادل (اتجاه فقط)", aboveD:"فوق التعادل", belowD:"تحت التعادل",
    wage:"ألف/أسبوع", shots:"تسديدات", faced:"تسديدات مواجهة", whatif:"ماذا لو؟",
    wiGoalOff:"لو ما دخل الهدف", wiSaveOff:"لو ما انصدّت", wiHead:"الرقم الظاهر", wiEv:"تقدير الأدلة", wiTag:"سيناريو محاكاة، مو اللي كان بيصير.",
    trace:"سجل الوكلاء (من سلّم لمن)", end:"انتهت المباراة",
    foot:"كل اللاعبين والأندية والعقود مولّدة بالكامل. لا توصيات شراء أو بيع. الرقم عبارة عن نطاق، وتحت 100 تسديدة نقول ما عندنا أدلة كافية. صوت Azure AI Speech المتاح للسعودية يقرأ بالفصحى، فالنص بلهجة سعودية والصوت سعودي-فصيح.",
    title:"حركة الانتباه", feedH:"شريط المباراة", feedSub:"كل جملة قيلت، ومتى. الجملة المقطوعة والمحذوفة تظهر في خط التنفس فوق.", roles:{FWD:"مهاجمون",MID:"وسط",DEF:"مدافعون",GK:"حراس"}, axisLo:"تحت التعادل", axisHi:"فوق التعادل", axisBE:"تعادل 1.0", legendObs:"الرقم الظاهر", legendEv:"نطاق الأدلة", legendLuck:"نصيب الحظ"
  },
  en: {
    tagline:"Commentary that spends each viewer's attention like a budget, and an investor ledger that separates skill from luck. All data is synthetic.",
    tabs:{casual:"Casual fan",analyst:"Analyst",blind:"Audio description",investor:"Investor"},
    voiceOn:"🔊 Voice on", voiceOff:"🔈 Voice off", voiceHint:"Voice works best at 6× or 1×.", noVoice:"No Arabic voice on this device. Cues still play.", voiceTest:"Voice is on", clipVoice:"recorded clip (synthetic)", speed:"Speed", seed:"Match", restart:"Restart", newMatch:"New match",
    speech:"Speech", silence:"Silence", cut:"Cut off", catch:"Catch-ups", drop:"Dropped",
    silentNow:"Silence. Nothing worth saying right now.", cutNote:"Cut off because a bigger moment arrived.", catchNote:"Said late, so it was shortened.",
    ledgerH:"Value ledger", ledgerSub:"Each player and their (fictional) contract. The circle is the headline number, the bar is the evidence-based estimate. Break-even is 1.",
    obs:"Headline", ev:"Evidence", luck:"Luck share", noev:"Not enough evidence", inconc:"No verdict, range includes break-even",
    above:"Above break-even (directional)", below:"Below break-even (directional)", aboveD:"Above break-even", belowD:"Below break-even",
    wage:"k/week", shots:"shots", faced:"shots faced", whatif:"What if?",
    wiGoalOff:"If the goal had not gone in", wiSaveOff:"If the save had not been made", wiHead:"Headline", wiEv:"Evidence", wiTag:"A simulation scenario, not what would have happened.",
    trace:"Agent log (who handed what to whom)", end:"Full time",
    foot:"Every player, club and contract is generated. No buy or sell advice. Numbers are ranges, and below 100 shots we say there is not enough evidence. The Saudi-locale Azure AI Speech voices read Modern Standard Arabic, so text is Saudi-flavoured and audio is Saudi-locale.",
    title:"Attention over the match", feedH:"Match tape", feedSub:"Every line that was spoken, and when. Cut-off and dropped lines show on the breath line above.", roles:{FWD:"Forwards",MID:"Midfield",DEF:"Defenders",GK:"Goalkeepers"}, axisLo:"below break-even", axisHi:"above break-even", axisBE:"break-even 1.0", legendObs:"Headline number", legendEv:"Evidence range", legendLuck:"Luck share"
  }
};
const VOICE={azure:false,audio:null,ctx:null,voices:[]};
fetch("/api/health").then(r=>r.json()).then(j=>{VOICE.azure=!!j.azure_tts;}).catch(()=>{});
function loadVoices(){ try{ VOICE.voices=speechSynthesis.getVoices()||[]; }catch(e){ VOICE.voices=[]; } }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
function pickVoice(lang){ const want=lang==="ar"?"ar":"en"; return VOICE.voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang==="ar"?"ar-sa":"en-gb"))||VOICE.voices.find(v=>v.lang.toLowerCase().startsWith(want))||null; }
function voiceMsg(t){ const m=document.getElementById("voiceMsg"); if(m) m.textContent=t||""; }
function voiceStop(){ try{ speechSynthesis.cancel(); }catch(e){} if(VOICE.audio){ VOICE.audio.pause(); VOICE.audio=null; } }
/* non-speech cues (always audible, no voice needed): goal = rising two-tone, cut-off = short tick */
function cue(kind){
  try{
    VOICE.ctx=VOICE.ctx||new (window.AudioContext||window.webkitAudioContext)(); const c=VOICE.ctx; if(c.state==="suspended") c.resume();
    const tones = kind==="goal" ? [[523,0,.16],[659,.14,.16],[784,.28,.34]] : kind==="cut" ? [[220,0,.07]] : [[440,0,.05]];
    for(const [f,t0,d] of tones){ const o=c.createOscillator(), g=c.createGain(); o.type=kind==="goal"?"triangle":"sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination);
      const t=c.currentTime+t0; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==="goal"?0.22:0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d+0.02); }
  }catch(e){}
}
function fnv(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
async function voiceSay(text,lang){
  voiceStop();
  const clip=window.__AUDIO&&window.__AUDIO[lang+":"+fnv(text)];
  if(clip){ try{ const a=new Audio("data:audio/mpeg;base64,"+clip); VOICE.audio=a; await a.play(); voiceMsg(tt("clipVoice")); return; }catch(e){ voiceMsg(String(e&&e.name||e)); } }
  if(VOICE.azure){
    try{
      const r=await fetch("/api/tts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,lang})});
      if(r.ok){ const a=new Audio(URL.createObjectURL(await r.blob())); VOICE.audio=a; await a.play(); voiceMsg("Azure AI Speech"); return; }
    }catch(e){}
  }
  try{
    if(!("speechSynthesis" in window)){ voiceMsg(tt("noVoice")); return; }
    loadVoices(); const v=pickVoice(lang);
    if(!v && lang==="ar"){ voiceMsg(tt("noVoice")); return; }
    const u=new SpeechSynthesisUtterance(text); u.lang=v?v.lang:(lang==="ar"?"ar-SA":"en-GB"); if(v) u.voice=v; u.rate=1.05;
    voiceMsg(v?v.name:"");
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} },80);  // Chrome drops speak() issued right after cancel()
  }catch(e){}
}
const $ = s => document.querySelector(s);
const S = { voice:false, profile:"casual", lang:"ar", es:null, meta:null, players:{}, rows:{}, score:{KBY:0,RMR:0}, speechSec:0, cuts:0, catches:0, drops:0, now:0, seed:35, goalsByShot:{} };
const W=1000, H=130, BASE=66, DUR=5400;
const ROLE_ORDER = {FWD:0, MID:1, GK:2, DEF:3};
const tt = k => T[S.lang][k];
const mm = t => Math.min(90, Math.floor(t/60)+1);
const fmt = (x,d=2) => (x>=0?"+":"")+x.toFixed(d);
const pName = p => S.lang==="ar" ? p.name_ar : p.name;
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}, parent){ const e=document.createElementNS(svgNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

function applyLang(){
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang==="ar" ? "rtl" : "ltr";
  $("#tagline").textContent=tt("tagline"); $("#lblSpeed").textContent=tt("speed"); $("#lblSeed").textContent=tt("seed");
  $("#restart").textContent=tt("restart"); $("#voiceBtn").textContent=S.voice?tt("voiceOn"):tt("voiceOff"); $("#voiceBtn").title=tt("voiceHint"); $("#newMatch").textContent=tt("newMatch");
  $("#lSpeech").textContent=tt("speech"); $("#lSilence").textContent=tt("silence"); $("#lCut").textContent=tt("cut"); $("#lCatch").textContent=tt("catch"); $("#lDrop").textContent=tt("drop");
  $("#hFeed").textContent=tt("feedH"); $("#sFeed").textContent=tt("feedSub"); $("#axis").innerHTML=`<span style="left:3.3%">${tt("axisLo")}</span><span style="left:46.8%;transform:translateX(-50%);color:var(--ink);font-weight:600">${tt("axisBE")}</span><span style="right:3.3%">${tt("axisHi")}</span>`; $("#hLedger").textContent=tt("ledgerH"); $("#sLedger").textContent=tt("ledgerSub"); $("#traceSum").textContent=tt("trace"); $("#foot").textContent=tt("foot");
  $("#breathTitle").textContent=tt("title");
  $("#legend").innerHTML = `<span><svg width="12" height="12" class="sw"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg>${tt("legendObs")}</span><span><span class="sw" style="background:var(--skill)"></span>${tt("legendEv")}</span><span><span class="sw" style="background:var(--luck)"></span>${tt("legendLuck")}</span>`;
  const tabs=$("#tabs"); tabs.innerHTML="";
  for(const k of ["casual","analyst","blind","investor"]){ const b=document.createElement("button"); b.setAttribute("role","tab"); b.setAttribute("aria-selected", k===S.profile); b.textContent=tt("tabs")[k]; b.onclick=()=>{S.profile=k; applyLang(); start();}; tabs.appendChild(b); }
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===S.lang));
}

function resetView(){
  S.score={KBY:0,RMR:0}; S.speechSec=0; S.cuts=S.catches=S.drops=0; S.now=0; S.goalsByShot={};
  $("#feed").innerHTML=""; $("#trace").innerHTML=""; $("#ledger").innerHTML=""; renderNow(null);
  const svg=$("#breath"); [...svg.querySelectorAll("*:not(title)")].forEach(n=>n.remove());
  el("line",{x1:0,x2:W,y1:BASE,y2:BASE,stroke:"var(--chalk-line)","stroke-width":1.5},svg);
  for(const m of [15,30,45,60,75]){ const x=m*60/DUR*W; el("line",{x1:x,x2:x,y1:BASE-5,y2:BASE+5,stroke:"var(--chalk-line)"},svg); const tx=el("text",{x,y:H-6,"text-anchor":"middle","font-size":12,fill:"var(--chalk-2)"},svg); tx.textContent=m+"'"; }
  el("line",{id:"cursor",x1:0,x2:0,y1:8,y2:H-22,stroke:"var(--gold)","stroke-width":1.4,opacity:.9},svg);
  updateMeta(); updateScore();
}
function updateScore(){ $("#sA").textContent=S.score.KBY; $("#sB").textContent=S.score.RMR; $("#clock").textContent=mm(S.now)+"'"; const c=$("#cursor"); if(c){const x=S.now/DUR*W; c.setAttribute("x1",x); c.setAttribute("x2",x);} }
function updateMeta(){
  $("#mSpeech").textContent=Math.round(S.speechSec)+"s";
  const sil = S.now>0 ? Math.max(0,1-S.speechSec/S.now) : 1; $("#mSilence").textContent=Math.round(sil*100)+"%";
  $("#mCut").textContent=S.cuts; $("#mCatch").textContent=S.catches; $("#mDrop").textContent=S.drops;
}
function renderNow(u){
  const n=$("#now"); n.innerHTML="";
  const p=document.createElement("p");
  if(!u){ p.className="silent"; p.textContent=tt("silentNow"); n.appendChild(p); return; }
  p.textContent=u.text; if(u.kind==="goal") p.className="goal"; n.appendChild(p);
  if(u.cut_off||u.catch_up){ const s=document.createElement("small"); s.textContent=u.cut_off?tt("cutNote"):tt("catchNote"); n.appendChild(s); }
}

function addUtterance(u){
  S.speechSec += Math.max(0,u.end-u.start); if(u.cut_off) S.cuts++; if(u.catch_up) S.catches++;
  const svg=$("#breath"); const x=u.start/DUR*W, w=Math.max(2.5,(u.end-u.start)/DUR*W), h=14+u.importance*58;
  el("rect",{x,y:BASE-h/2,width:w,height:h,rx:1.2,fill: u.kind==="ledger"?"var(--mint)":"var(--chalk)",opacity: u.cut_off?.6:.95},svg);
  if(u.cut_off){ const xx=x+w; el("path",{d:`M${xx} ${BASE-h/2-6} l-4 6 l8 0 z`,fill:"var(--flare)"},svg); }
  renderNow(u);
  if(S.voice){ if(u.kind==="goal") cue("goal"); else if(u.cut_off) cue("cut"); voiceSay(u.text,u.lang||S.lang); }
  clearTimeout(S._silenceTimer); S._silenceTimer=setTimeout(()=>renderNow(null), Math.max(1200,(u.end-u.start)/Number($("#speed").value)*1000+900));
  const li=document.createElement("li"); li.className=(u.kind==="goal"?"goal ":"")+"new";
  li.innerHTML=`<span class="t">${mm(u.start)}'</span><span class="txt"></span>`;
  li.querySelector(".txt").textContent=u.text;
  if(u.cut_off||u.catch_up){ const n=document.createElement("span"); n.className="note"; n.textContent=u.cut_off?tt("cutNote"):tt("catchNote"); li.appendChild(n); }
  if((S.profile==="investor"||S.profile==="analyst") && (u.kind==="goal"||u.kind==="save") && u.evidence && u.evidence[0]){
    const b=document.createElement("button"); b.className="mini"; b.textContent=tt("whatif"); b.onclick=()=>whatIf(u,li,b); const n=document.createElement("span"); n.className="note"; n.appendChild(b); li.appendChild(n);
  }
  $("#feed").prepend(li); updateMeta();
}
function addDropped(d){ S.drops++; const svg=$("#breath"); el("circle",{cx:d.t/DUR*W,cy:BASE,r:4.5,fill:"none",stroke:"var(--chalk-2)","stroke-width":1.4},svg); updateMeta(); }
function addEvent(e){
  if(e.kind==="goal"){ S.score[e.team]++; const svg=$("#breath"); const x=e.t/DUR*W; el("line",{x1:x,x2:x,y1:12,y2:BASE-44,stroke:"var(--flare)","stroke-width":1.8},svg); el("circle",{cx:x,cy:12,r:5,fill:"var(--flare)"},svg); }
  updateScore();
}
function addTrace(tr){ const li=document.createElement("li"); li.innerHTML=`<b></b> <span></span>`; li.querySelector("b").textContent=`${mm(tr.t)}' ${tr.agent}`; li.querySelector("span").textContent=`${tr.action} ${tr.detail||""}`; const ol=$("#trace"); ol.appendChild(li); if(ol.children.length>240) ol.removeChild(ol.firstChild); }

/* ---- ledger ---- */
const SCALE_MAX=2.2;
function barX(v,w){ return 8+Math.max(0,Math.min(1,v/SCALE_MAX))*(w-16); }
function ledgerRow(r){
  const li=document.createElement("li"); li.id="L-"+r.id; li.className="row"; li.dataset.role=r.role;
  const dec=r.decomposition, gate=dec.gate, v=r.verdict.code;
  const who=document.createElement("div"); who.className="who"; who.innerHTML=`<span></span><small></small>`;
  who.querySelector("span").textContent=pName(r);
  who.querySelector("small").textContent=`${r.wage_k_week} ${tt("wage")}`;
  const w=240,h=34; const svg=document.createElementNS(svgNS,"svg"); svg.setAttribute("viewBox",`0 0 ${w} ${h}`); svg.setAttribute("role","img");
  const c=(x)=>barX(x,w);
  el("rect",{x:c(0),y:h/2-1,width:c(SCALE_MAX)-c(0),height:2,fill:"var(--rule)"},svg);
  for(const tk of [0,0.5,1.5,2]){ el("line",{x1:c(tk),x2:c(tk),y1:h/2-4,y2:h/2+4,stroke:"var(--rule)"},svg); }
  const be=c(1); el("line",{x1:be,x2:be,y1:2,y2:h-2,stroke:"var(--ink)","stroke-width":1.4},svg);
  const lo=c(Math.max(0,r.pulse.lo)), hi=c(Math.max(0,r.pulse.hi));
  const up=v.startsWith("above"), down=v.startsWith("below");
  const col = gate==="insufficient" ? "var(--ink-2)" : (up?"var(--skill)":down?"var(--alert)":"var(--ink-2)");
  if(gate==="insufficient"){ el("line",{x1:lo,x2:Math.max(hi,lo+2),y1:h/2,y2:h/2,stroke:"var(--ink-2)","stroke-width":3,"stroke-dasharray":"3 3",opacity:.55},svg); }
  else { el("rect",{x:lo,y:h/2-5,width:Math.max(4,hi-lo),height:10,rx:5,fill:col,opacity:gate==="directional"?.45:.9},svg); }
  el("circle",{cx:c(Math.max(0,r.pulse_observed)),cy:h/2,r:6,fill:"var(--card)",stroke:"var(--ink)","stroke-width":2},svg);
  const gauge=document.createElement("div"); gauge.className="gauge"; gauge.appendChild(svg);
  const read=document.createElement("div"); read.className="read";
  const unit = r.role==="GK" ? tt("faced") : tt("shots");
  const chip=document.createElement("span"); chip.className="chip "+(gate==="insufficient"?"none":up?"up":down?"down":"mid");
  const glyph = gate==="insufficient" ? "○" : up ? "▲" : down ? "▼" : "◆";
  let label;
  if(v==="no_evidence") label=tt("noev"); else if(v==="inconclusive") label=tt("inconc");
  else if(v==="above_directional") label=tt("above"); else if(v==="below_directional") label=tt("below");
  else label=(v==="above"?tt("aboveD"):tt("belowD"));
  chip.textContent=`${glyph} ${label}`; read.appendChild(chip);
  const n=document.createElement("span"); n.textContent=`${dec.n} ${unit}`; read.appendChild(n);
  if(gate!=="insufficient"){
    const e=document.createElement("span"); e.textContent=`${tt("obs")} ${r.pulse_observed.toFixed(2)} · ${tt("ev")} \u2066${r.pulse.lo.toFixed(2)}–${r.pulse.hi.toFixed(2)}\u2069`; read.appendChild(e);
    const L=dec.luck_share, lb=document.createElement("span"); lb.className="luckbar";
    const lw=90; const ls=document.createElementNS(svgNS,"svg"); ls.setAttribute("viewBox",`0 0 ${lw} 10`);
    el("rect",{x:0,y:2,width:lw,height:6,rx:3,fill:"var(--rule)"},ls);
    el("rect",{x:0,y:2,width:Math.max(2,L.mean*lw),height:6,rx:3,fill:"var(--luck)"},ls);
    el("line",{x1:L.lo*lw,x2:L.hi*lw,y1:5,y2:5,stroke:"var(--ink)","stroke-width":1.4},ls);
    el("line",{x1:L.lo*lw,x2:L.lo*lw,y1:1,y2:9,stroke:"var(--ink)","stroke-width":1.4},ls);
    el("line",{x1:L.hi*lw,x2:L.hi*lw,y1:1,y2:9,stroke:"var(--ink)","stroke-width":1.4},ls);
    lb.appendChild(ls); const lt=document.createElement("span"); lt.textContent=`${tt("luck")} \u2066${Math.round(L.lo*100)}–${Math.round(L.hi*100)}%\u2069`; lb.appendChild(lt); read.appendChild(lb);
  }
  li.append(who,gauge,read); return li;
}
function renderLedger(rows, flashIds=[]){
  const ul=$("#ledger"); const list=Object.values(rows).sort((a,b)=>ROLE_ORDER[a.role]-ROLE_ORDER[b.role] || b.wage_k_week-a.wage_k_week);
  ul.innerHTML=""; let last=null;
  for(const r of list){
    if(r.role!==last){ const g=document.createElement("li"); g.className="group"; g.textContent=tt("roles")[r.role]; ul.appendChild(g); last=r.role; }
    const li=ledgerRow(r); if(flashIds.includes(r.id)) li.classList.add("flash"); ul.appendChild(li);
  }
}

async function whatIf(u,li,btn){
  const shot=u.evidence[0]; btn.disabled=true;
  try{
    const r=await fetch("/api/whatif",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({seed:S.seed,shot_id:shot,goal:u.kind==="save"})}); const d=await r.json();
    const sub=document.createElement("div"); sub.className="whatif";
    const key = u.kind==="goal" ? Object.keys(d.players)[0] : Object.keys(d.players)[1];
    const p=d.players[key]; const nm=pName(S.players[key]);
    sub.textContent=`${u.kind==="goal"?tt("wiGoalOff"):tt("wiSaveOff")}: ${nm} · ${tt("wiHead")} ${fmt(p.delta_pulse_observed)} · ${tt("wiEv")} ${fmt(p.delta_pulse_evidence)}. ${tt("wiTag")}`;
    li.appendChild(sub);
  }catch(e){ btn.disabled=false; }
}

/* ---- stream ---- */
function start(){
  voiceStop();
  if(S.es){ S.es.close(); }
  S.seed=Number($("#seed").value)||35; resetView();
  const url=`/api/stream?seed=${S.seed}&profile=${S.profile}&lang=${S.lang}&speed=${$("#speed").value}`;
  const es=new EventSource(url); S.es=es;
  es.onmessage=ev=>{
    const m=JSON.parse(ev.data); if(m.t!==undefined && m.type!=="meta") S.now=Math.max(S.now,m.t);
    switch(m.type){
      case "meta": S.meta=m.meta; S.players={}; m.meta.players.forEach(p=>S.players[p.id]=p);
        $("#tA").textContent=S.lang==="ar"?m.meta.teams.KBY.name_ar:m.meta.teams.KBY.name; $("#tB").textContent=S.lang==="ar"?m.meta.teams.RMR.name_ar:m.meta.teams.RMR.name;
        S.rows={}; m.baseline.forEach(r=>S.rows[r.id]=r); renderLedger(S.rows); break;
      case "event": addEvent(m); break;
      case "utterance": addUtterance(m); break;
      case "dropped": addDropped(m); break;
      case "ledger": Object.assign(S.rows,m.rows); renderLedger(S.rows,Object.keys(m.rows)); break;
      case "trace": addTrace(m); break;
      case "end": es.close(); S.now=5400; updateScore(); updateMeta(); S.rows={}; m.ledger_final.forEach(r=>S.rows[r.id]=r); renderLedger(S.rows); break;
    }
    updateScore();
  };
  es.onerror=()=>{ es.close(); };
}
$("#voiceBtn").onclick=()=>{ S.voice=!S.voice; $("#voiceBtn").setAttribute("aria-pressed",S.voice); $("#voiceBtn").textContent=S.voice?tt("voiceOn"):tt("voiceOff"); if(!S.voice){ voiceStop(); voiceMsg(""); } else { cue("goal"); voiceSay(tt("voiceTest"),S.lang); } };
$("#restart").onclick=start; $("#speed").onchange=start; $("#seed").onchange=start;
$("#newMatch").onclick=()=>{ $("#seed").value=Math.floor(Math.random()*9000)+1; start(); };
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{ S.lang=b.dataset.l; applyLang(); start(); });
applyLang(); start();
</script>
